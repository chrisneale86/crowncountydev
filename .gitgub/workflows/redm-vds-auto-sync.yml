name: VDS Repo Auto Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_repo:
    name: Sync VDS repository
    runs-on: [self-hosted, windows]

    steps:
      - name: Fetch and pull latest changes
        shell: powershell
        env:
          REPO_PATH: 'C:\Users\Administrator\Desktop\dev\crowncountydev'
        run: |
          if (-not (Test-Path $env:REPO_PATH)) {
            throw "Repository path not found: $env:REPO_PATH"
          }

          Set-Location $env:REPO_PATH

          git status
          git fetch origin
          git pull origin main

      - name: Send success webhook
        if: success()
        shell: powershell
        env:
          WEBHOOK_URL: ${{ https://discord.com/api/webhooks/1483556769497350327/jX8m8Rj-mwCP5ov7iVPP210pFxtaYiSL9vO5Ychk-mxK8OsdJcWPuqP9EPPd0tL9-4jt/github }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            Write-Host "WEBHOOK_URL secret is not set. Skipping webhook."
            exit 0
          }

          $body = @{
            event   = "deployment"
            status  = "success"
            repo    = "${{ github.repository }}"
            branch  = "${{ github.ref_name }}"
            actor   = "${{ github.actor }}"
            commit  = "${{ github.sha }}"
            message = "VDS repo fetched and pulled successfully"
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Uri $env:WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

      - name: Send failure webhook
        if: failure()
        shell: powershell
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            Write-Host "WEBHOOK_URL secret is not set. Skipping webhook."
            exit 0
          }

          $body = @{
            event   = "deployment"
            status  = "failure"
            repo    = "${{ github.repository }}"
            branch  = "${{ github.ref_name }}"
            actor   = "${{ github.actor }}"
            commit  = "${{ github.sha }}"
            message = "VDS repo sync failed"
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Uri $env:WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $body
