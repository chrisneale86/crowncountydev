<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ticket</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrap" class="hidden">
      <div class="ticketWrap">
        <img id="ticketImg" class="ticketImg" src="" alt="ticket" />
        <div class="overlay">
          <div class="olrow"><span class="olk">FROM</span><span id="origin"></span></div>
          <div class="olrow"><span class="olk">TO</span><span id="dest"></span></div>
          <div class="olrow"><span class="olk">PASSENGER</span><span id="buyer"></span></div>
        </div>
      </div>

      <div class="fallback hidden" id="fallback">
        <div class="card">
          <div class="title">TRAIN TICKET</div>
          <div class="row"><span class="k">Passenger:</span><span id="buyer2"></span></div>
          <div class="row"><span class="k">From:</span><span id="origin2"></span></div>
          <div class="row"><span class="k">To:</span><span id="dest2"></span></div>
          <div class="row"><span class="k">Paid:</span><span id="price2"></span></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
